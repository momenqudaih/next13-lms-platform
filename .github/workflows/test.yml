name: Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Generate Prisma Client
      run: npx prisma generate
    
    - name: Run unit tests
      run: npm run test:unit
      env:
        NODE_ENV: test
        DATABASE_URL: "mysql://test:test@localhost:3306/test_db"
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY_TEST }}
        CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY_TEST }}
    
    - name: Upload unit test coverage
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage/lcov.info
        flags: unit-tests

  integration-tests:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
          MYSQL_USER: test
          MYSQL_PASSWORD: test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Setup test database
      run: |
        npx prisma generate
        npx prisma db push
      env:
        DATABASE_URL: "mysql://test:test@localhost:3306/test_db"
    
    - name: Run integration tests
      run: npm run test:integration
      env:
        NODE_ENV: test
        DATABASE_URL: "mysql://test:test@localhost:3306/test_db"
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY_TEST }}
        CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY_TEST }}
        STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY_TEST }}
        STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET_TEST }}
        UPLOADTHING_SECRET: ${{ secrets.UPLOADTHING_SECRET_TEST }}
        UPLOADTHING_APP_ID: ${{ secrets.UPLOADTHING_APP_ID_TEST }}
        MUX_TOKEN_ID: ${{ secrets.MUX_TOKEN_ID_TEST }}
        MUX_TOKEN_SECRET: ${{ secrets.MUX_TOKEN_SECRET_TEST }}
        NEXT_PUBLIC_APP_URL: "http://localhost:3000"

  e2e-tests:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
          MYSQL_USER: test
          MYSQL_PASSWORD: test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    
    - name: Setup test database
      run: |
        npx prisma generate
        npx prisma db push
        npm run db:seed
      env:
        DATABASE_URL: "mysql://test:test@localhost:3306/test_db"
    
    - name: Build application
      run: npm run build
      env:
        NODE_ENV: production
        DATABASE_URL: "mysql://test:test@localhost:3306/test_db"
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY_TEST }}
        CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY_TEST }}
        STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY_TEST }}
        STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET_TEST }}
        UPLOADTHING_SECRET: ${{ secrets.UPLOADTHING_SECRET_TEST }}
        UPLOADTHING_APP_ID: ${{ secrets.UPLOADTHING_APP_ID_TEST }}
        MUX_TOKEN_ID: ${{ secrets.MUX_TOKEN_ID_TEST }}
        MUX_TOKEN_SECRET: ${{ secrets.MUX_TOKEN_SECRET_TEST }}
        NEXT_PUBLIC_APP_URL: "http://localhost:3000"
    
    - name: Run Playwright tests
      run: npm run test:e2e
      env:
        NODE_ENV: test
        DATABASE_URL: "mysql://test:test@localhost:3306/test_db"
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY_TEST }}
        CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY_TEST }}
        STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY_TEST }}
        STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET_TEST }}
        UPLOADTHING_SECRET: ${{ secrets.UPLOADTHING_SECRET_TEST }}
        UPLOADTHING_APP_ID: ${{ secrets.UPLOADTHING_APP_ID_TEST }}
        MUX_TOKEN_ID: ${{ secrets.MUX_TOKEN_ID_TEST }}
        MUX_TOKEN_SECRET: ${{ secrets.MUX_TOKEN_SECRET_TEST }}
        NEXT_PUBLIC_APP_URL: "http://localhost:3000"
    
    - uses: actions/upload-artifact@v3
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

  security-scan:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
    
    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'

  performance-test:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build application
      run: npm run build
    
    - name: Run Lighthouse CI
      run: |
        npm install -g @lhci/cli@0.12.x
        lhci autorun
      env:
        LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}



